name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Black check
        run: black --check .

      - name: Ruff check
        run: ruff check .

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (force CPU Torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # install CPU-only torch, torchvision, torchaudio
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio -U --no-cache-dir
          pip install pytest pytest-cov

      - name: Quick env sanity
        run: |
          python -V
          pip list | grep -E "torch|torchvision|pytest" || true
          ls -la
          echo "PYTHONPATH=$PWD"

      - name: Run tests (quick)
        env:
          PYTHONPATH: ${{ github.workspace }}
          CUDA_VISIBLE_DEVICES: ""   # force CPU only
        run: pytest -v --disable-warnings --maxfail=1

      - name: Run tests with coverage
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
          CUDA_VISIBLE_DEVICES: ""
        run: pytest --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true


  smoke-test:
    runs-on: ubuntu-latest
    needs: tests
    env:
      PYTHONPATH: ${{ github.workspace }}   # (optional) for local imports in app.py
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install streamlit

      - name: Launch Streamlit (headless) and verify it serves
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          echo $! > streamlit.pid
          for i in {1..25}; do
            if curl -sSf http://localhost:8501/ >/dev/null; then
              echo "Streamlit is up"; break
            fi
            sleep 1
          done
          curl -sSf http://localhost:8501/ >/dev/null

      - name: Shutdown Streamlit
        if: always()
        run: |
          kill $(cat streamlit.pid) || true
